# FlexKV tier config for recsys KVCacheManager.
# Layerwise is not set here. The benchmark turns it on with --layerwise
# and --layer-granularity N.
# Use with:
#   export RECSYS_FLEXKV_CONFIG_PATH=/path/to/flexkv_layerwise.yml
cpu_cache_gb: 0.2
ssd_cache_gb: 0.99
ssd_cache_dir: /path/to/your/ssd_cache
enable_gds: false
enable_p2p_cpu: false
enable_p2p_ssd: false
enable_3rd_remote: false
